#
# Preview build (only for pull requests)
#
# Builds the preview and uploads it. `preview.yml` deploys it, and the two are
# separate workflows for two separate reasons.
#
# The first is trust. This one runs on `pull_request`, which for a fork's pull
# request means a read-only token and no access to the repo secrets -- and that
# is the property worth keeping, because everything here is the pull request's
# own code (`pnpm install` alone is arbitrary `postinstall` scripts). The deploy
# runs back in this repository's context with the Vercel token, and never
# executes any of it: it unpacks the artifact below. The artifact is the
# boundary between the two.
#
# The second is when. `workflow_run` fires when a whole run finishes, not when
# a job does, so leaving this inside `ci.yml` would have put the preview behind
# the eight test shards -- #202 undone by the back door. Measured on #220: this
# job takes 1.3min, the run it was part of takes 6, and ~20 on a pull request
# that touches many examples. Its own workflow finishes when it finishes.
#
# Nothing about the build itself moved: same runner, same install, same turbo
# and pnpm caches (the Actions cache is scoped by repository and branch, never
# by workflow), same `BASE_PATH`, so the same `build2` hashes as everywhere
# else. Permissions are `ci.yml`'s, verbatim, for the same reason.
#
name: Preview build

on:
  pull_request: {}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  preview-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: configurepages
        uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: rharkor/caching-for-turbo@v2.5.1

      # The same `BASE_PATH` as the Pages build, and not for tidiness:
      # `BASE_PATH` is a `globalEnv`, and it really does change every example's
      # `dist` (vite's `--base`). Building the preview without it gave every
      # `build2` a different hash from the one `ci.yml` and the shards
      # produce -- 167 rebuilds, ~3.5min, and never a cache hit across runs
      # either, since `main` never produces those hashes and a pull request
      # cannot read another one's cache. With it, the hashes line up, and what
      # is actually built here is what the shards have not cached yet.
      #
      # What it costs: the preview is served from `<url>${BASE_PATH}`, not the
      # domain root, since the pages link to each other by absolute path. That
      # is the production layout, which is what a preview should be showing.
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
          # The production origin, deliberately: the <head> URLs are canonical
          # links, and a preview that is "the production layout" should carry
          # them too -- besides, a different value is a different `build2`
          # hash, and these have to be the hashes everything else produces.
          BASE_URL: ${{ steps.configurepages.outputs.base_url }}

      # `base_path` travels with the build because the job that deploys it
      # cannot recompute it: `configure-pages` reads the Pages settings, and
      # asking for that permission in a workflow that holds the Vercel token
      # buys nothing. `preview.yml` validates the value before it uses it.
      - run: echo "${{ steps.configurepages.outputs.base_path }}" > base_path
      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: |
            out
            base_path
