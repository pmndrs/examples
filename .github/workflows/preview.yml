#
# Preview
#
# The half of `ci.yml`'s `preview-job` that needs the Vercel token, split off
# so that a fork's pull request can have a preview at all.
#
# `pull_request` gives a fork's run a read-only token and no secrets, on
# purpose: everything it runs is the pull request's code. So the deploy happens
# here instead, in a workflow that runs in this repository, with the secrets --
# and that is only safe for as long as it runs none of that code. It does not:
# no checkout of the head, no `pnpm install`, no build. It downloads what
# `ci.yml` built and uploads it.
#
# The artifact is the boundary, and everything inside it is untrusted input.
# Two consequences, both of them below: the Build Output API's own directories
# (`functions/`, `config.json`) are written here and never taken from the
# artifact -- otherwise a pull request could put serverless functions on this
# account -- and `base_path`, which reaches a `Location` header, is checked
# before it is used.
#
# What is left for the fork to reach: static files it wrote, on a
# `*.vercel.app` URL, in a project that has no environment variables and no
# domain of ours. Which is what a preview of its own code is.
#
# Two doors in, and which one a pull request gets is the only difference the
# fork makes:
#
#   - a branch on this repository -- `workflow_run`, as soon as CI has built
#     it. Nobody approves their own colleague's preview, and that is how this
#     behaved before the split.
#
#   - a fork -- nothing, until a maintainer puts the `preview` label on the
#     pull request. That label is the button: adding one needs triage rights
#     here, which is exactly the set of people who should be deciding, and the
#     contributor cannot add it to their own. It comes straight back off, so
#     the next click is another deploy.
#
# `pull_request_target` is what makes that label event able to see the secrets.
# The reason it is usually a footgun is a checkout of the pull request's head
# followed by anything that executes it -- which is the one thing this file is
# built not to do.
#
name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled]

# Deliberately not the repository defaults: this workflow holds the token, so
# it gets the permissions it uses and nothing else. `actions: read` reads
# another run's artifact, `pull-requests: write` takes the label back off.
permissions:
  actions: read
  deployments: write
  pull-requests: write

jobs:
  preview-job:
    if: >-
      ${{ (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'pull_request_target'
        && github.event.label.name == 'preview') }}
    runs-on: ubuntu-latest
    # The box on the run, which is the only place the URL would otherwise not
    # appear. Required reviewers on this environment would work, and would be a
    # second approval on top of the label, in the Actions tab rather than on the
    # pull request -- the label is the gate.
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}

    env:
      # No token, no preview: a checkout of this repository that never set them
      PREVIEW: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      # Off first, and not at the end: a failed deploy leaves a button that can
      # be pressed again rather than a label to remove by hand.
      - uses: actions/github-script@v9
        if: ${{ github.event_name == 'pull_request_target' }}
        continue-on-error: true # it is the button, not the deploy
        with:
          script: |
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              name: "preview",
            });

      # Which commit, and which run built it. Both come from the event -- the
      # only thing a pull request chooses here is its own head, and the run has
      # to be a CI run of this repository on that exact sha.
      - id: what
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            # The label can land before CI has finished, in which case the
            # artifact is not there yet and the download below says so: press
            # it again once the build is green.
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | first | .id')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # No artifact is a build that failed, and the run goes red here rather
      # than on the pull request -- where `preview-job` is already red for it.
      - uses: actions/download-artifact@v8
        if: ${{ env.PREVIEW == 'true' }}
        with:
          name: preview
          path: artifact
          run-id: ${{ steps.what.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: preview
        if: ${{ env.PREVIEW == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          base_path=$(cat artifact/base_path)
          # It came out of a job that ran the pull request's code, and it ends
          # up in a `Location`. A leading `//` is a URL to somebody else's host,
          # which is the whole of what could go wrong here.
          case "$base_path" in
            //*|*[!A-Za-z0-9._/-]*) echo "refusing base_path: $base_path"; exit 1 ;;
            /*|"") ;;
            *) echo "refusing base_path: $base_path"; exit 1 ;;
          esac

          mkdir -p .vercel/output
          # `out`, not `out${base_path}`: the site lives one level down, and the
          # static root has to be the level its absolute links resolve against.
          # `static/` is also the only thing the artifact is allowed to become
          # -- a `functions/` the pull request wrote inside `out` lands under it
          # as a file, not as code Vercel would run.
          mv artifact/out .vercel/output/static
          # `cleanUrls`: the website exports flat `<name>.html` pages and links
          # to them without the extension. The route sends the bare deployment
          # URL -- the one Vercel prints, and the one anyone trims to -- to the
          # home page, which now sits under the base path rather than at `/`.
          printf '{"version":3,"cleanUrls":true,"routes":[{"src":"/","status":308,"headers":{"Location":"%s"}}]}' \
            "${base_path:-/}" > .vercel/output/config.json
          # `--archive`: one tarball, not 2.4k file uploads
          url=$(npx --yes vercel@latest deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url$base_path" >> "$GITHUB_OUTPUT"

      # The pull request's "View deployment" box, which Vercel's git integration
      # would have filled had we let it deploy. The sha is the event's, not the
      # artifact's: a fork's head commit is reachable here as `refs/pull/N/head`.
      - uses: actions/github-script@v9
        if: ${{ env.PREVIEW == 'true' }}
        env:
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ steps.what.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.SHA,
              environment: "preview",
              transient_environment: true, // superseded by the next one
              auto_merge: false, // deploy that ref, not a merge of the base into it
              required_contexts: [], // the checks that would gate it are the ones running this
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: data.id,
              state: "success",
              environment_url: process.env.URL,
            });
