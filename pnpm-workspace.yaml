pmOnFail: download
shamefullyHoist: true

packages:
  - apps/*
  - demos/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  # @react-three/postprocessing 3.x depends on postprocessing ^6.36.6, which
  # floats to 6.39.x -- and 6.37+ requires three >= 0.174. The demos stay on
  # three 0.165 (the @splinetool/loader patch is keyed to r165), so pin the
  # transitive copy to the last release that accepts it (>= 0.157 < 0.173).
  postprocessing: 6.36.6
  # lamina 1.1.23 declares itself as a dependency ("lamina": "^1.1.22"), so a
  # nested 1.2.2 gets installed that nothing imports -- and 1.2.2 wants
  # three >= 0.170, producing a bogus unmet-peer warning. Collapse it.
  lamina: 1.1.23

patchedDependencies:
  '@splinetool/loader@0.9.153': patches/@splinetool__loader@0.9.153.patch
