pmOnFail: download
shamefullyHoist: true

packages:
  - apps/*
  - examples/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  # @react-three/postprocessing 3.x depends on postprocessing ^6.36.6, which
  # floats to 6.39.x -- and 6.37+ requires three >= 0.174. The examples stay on
  # three 0.165 (the @splinetool/loader patch is keyed to r165), so pin the
  # transitive copy to the last release that accepts it (>= 0.157 < 0.173).
  postprocessing: 6.36.6

patchedDependencies:
  "@splinetool/loader@0.9.153": patches/@splinetool__loader@0.9.153.patch
  # `dist/Ecctrl.d.ts` re-exports `EcctrlJoystick` from `../src/EcctrlJoystick`
  # -- the untranspiled source -- rather than from the `dist/EcctrlJoystick.d.ts`
  # it ships right next to it. `skipLibCheck` only exempts `.d.ts`, so that
  # `.tsx` is pulled into the program and type-checked under our strict config,
  # failing on the package's own errors. Point the re-export at the sibling
  # declaration, which is what every other export in the file already does.
  ecctrl@1.0.88: patches/ecctrl@1.0.88.patch

minimumReleaseAgeExclude:
  - material-theme-builder@3.0.0
  - "@react-three/drei@10.7.8"
